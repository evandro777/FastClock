[package]
name = "fastclock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Light and fast Linux app built in Rust with Slint."

[dependencies]
fastclock-core = { path = "../core" }
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit", "renderer-software", "software-renderer-systemfonts", "compat-1-2", "unstable-winit-030"] }

# async-io instead of the default tokio: no async runtime in this app.
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
# Already in the tree through ksni and slint: desktop notifications, the file chooser and the Background portal.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# Decodes the tray icon.
png = "0.18"

[build-dependencies]
slint-build = "1.19"
